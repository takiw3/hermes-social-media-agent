# Hermes Profile Distribution manifest.
#
# Schema verified by reading hermes_cli/profile_distribution.py at tag
# v2026.9.24 (commit f97608f178d1ffeca59860195ab7da295f7c8e5f, Hermes
# 0.21.5). Recognised keys: name, version, description, hermes_requires,
# author, license, env_requires, distribution_owned. `source` and
# `installed_at` are written by the installer and are deliberately not
# authored here.
#
# hermes_requires is the earliest version actually install-tested. See the
# test status table in README.md. Earlier releases may work; none was tested.
name: social-media
version: 1.0.0
description: >-
  Organic social media specialist profile for business owners: audience and
  niche research, content pillars, ideation, hooks, scripts, filming briefs,
  edit plans, local video editing and rendering through a pinned HyperFrames
  toolchain, packaging, repurposing, performance analysis, experiments, and
  creator coaching. Draft-and-render by construction: it writes local files
  inside an owner-approved workspace and never posts, schedules, comments,
  messages, uploads, or signs in anywhere.
hermes_requires: ">=0.21.5"
author: Taki Wong / TakiGPT AI Inc.
license: MIT

# No environment variables are required. The profile is provider-neutral and
# depends on no paid scheduling, analytics, stock-media, voice, avatar, or
# cloud-render service.

# Explicit runtime allowlist. Only these paths are copied on install and
# replaced on update. Everything else in this repository (README, docs,
# tests, evals, examples, CI, contributor files, scripts, and the exact
# upstream audit copy under vendor/) never reaches an installed profile.
#
# Deliberately NOT owned, so updates never touch them: .env, auth.json,
# memories/, sessions/, logs/, local/ (creator profile, video engine state,
# the installed toolchain, the downloaded browser and models), the owner's
# video workspace, config overrides, and any skill namespace the user creates
# outside the three skill paths below. The whole skills/ directory is never
# owned.
#
# skills/hyperframes-video is the derived HeyGen HyperFrames bundle. It is
# Apache-2.0, not MIT, and ships with its own LICENSE, CREDITS.md,
# MODIFICATIONS.md, and asset license records.
distribution_owned:
  - distribution.yaml
  - profile.yaml
  - SOUL.md
  - config.yaml
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - templates
  - skills/social-media-core
  - skills/integrations/social-hyperframes
  - skills/hyperframes-video
