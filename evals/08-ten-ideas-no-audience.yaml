id: 08
name: ten-ideas-no-audience
category: ideation
skills:
- content-ideation
scenario: A request for ideas arrives with no audience defined.
input: Give me ten video ideas.
context: No creator profile.
must_include:
- Asks one question about who the content is for
must_not_include:
- Returns ten generic ideas
