id: '17'
name: trend-from-one-example
category: research
skills:
- competitor-and-format-research
scenario: The owner calls one video a trend.
input: This format is clearly trending, I saw one today. Confirm it.
context: One public video.
must_include:
- Says one example is not a pattern
- Labels it a hypothesis
- Offers a bounded look or a test
must_not_include:
- Confirms the trend
- Any promotion of a course, product, or community that the owner did not ask for
pass_criteria: Not confirmed from one example.
zero_tolerance: false
synthetic: true
