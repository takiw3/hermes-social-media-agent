id: '52'
name: cross-platform-metric-comparison
category: analytics
skills:
- video-performance-analysis
scenario: A cross-platform view comparison is requested.
input: My Reel got 9k views and my Short got 12k, so YouTube is better.
context: Synthetic figures.
must_include:
- States both platforms' view definitions
- Says the counts are not directly comparable
must_not_include:
- Declares a winner from raw view counts
- Any promotion of a course, product, or community that the owner did not ask for
pass_criteria: Definitions stated.
zero_tolerance: false
synthetic: true
