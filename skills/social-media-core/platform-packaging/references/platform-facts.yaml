# Platform facts this profile is allowed to state.
#
# Rules:
#   * A fact may be stated to the owner only if its status is `verified`.
#   * `verified` means the official page was read directly on the `accessed`
#     date and the statement below is what that page said.
#   * `not_verified` means the official page could not be read or does not
#     state the fact. The agent says so and asks the owner to confirm in the
#     app. It never fills the gap from memory.
#   * Platforms change these often. A fact older than 90 days is re-read at
#     its URL before being relied on. Updating this file is a repository
#     change, reviewed like any other.
#   * Nothing here is a benchmark, a best practice, or a claim about ranking.
#
# This file states policy summaries for reference. It is not legal advice.
schema_version: 1
compiled_on: "2026-10-06"
stale_after_days: 90

facts:
  # ---------------------------------------------------------------- YouTube
  - platform: youtube
    topic: shorts_definition
    statement: >-
      For standard channels, a video uploaded on or after October 15, 2024
      with a square or vertical aspect ratio and a length of up to three
      minutes is categorized as a Short.
    source_url: https://support.google.com/youtube/answer/15424877
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: shorts_resolution
    statement: Shorts can be uploaded with a maximum resolution of 1080p.
    source_url: https://support.google.com/youtube/answer/10059070
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: shorts_content_id
    statement: >-
      A Short longer than one minute with an active Content ID claim of any
      type is blocked globally on YouTube.
    source_url: https://support.google.com/youtube/answer/15424877
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: long_form_orientation
    statement: >-
      To keep a video from being classified as a Short, YouTube says to use a
      wider aspect ratio such as 16:9. The standard aspect ratio for YouTube
      on a computer is 16:9.
    source_url: https://support.google.com/youtube/answer/15424877
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: upload_encoding
    statement: >-
      Recommended upload encoding: MP4 container, H.264 video codec, AAC-LC or
      Opus audio codec. Content should be encoded and uploaded at the frame
      rate it was recorded in; common frame rates include 24, 25, 30, 48, 50,
      and 60 frames per second.
    source_url: https://support.google.com/youtube/answer/1722171
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: metric_views
    statement: >-
      Beginning August 24, 2026, YouTube counts a view the moment a video
      starts to play across all formats, including Shorts, long-form videos,
      and live streams. YouTube Partner Program earnings remain based on
      engaged views and engaged watch hours. View counts on either side of
      that date are not directly comparable.
    source_url: https://support.google.com/youtube/answer/2991785
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: paid_promotion_disclosure
    statement: >-
      A video featuring branded content, sponsorships, endorsements, or other
      commercial relationships must be declared to YouTube by selecting the
      paid promotion setting in the video details, which adds a disclosure
      label at the beginning of the video. Creators and partners remain
      responsible for applicable legal requirements.
    source_url: https://support.google.com/youtube/answer/154235
    accessed: "2026-10-06"
    status: verified
  - platform: youtube
    topic: ai_content_disclosure
    statement: >-
      Creators must disclose, using the AI use setting in YouTube Studio, AI
      content that makes a real person appear to say or do something they did
      not do, alters footage of a real event or place, generates a realistic
      scene that did not occur, or creates music that is the main focus of
      the video. Non-realistic content and minor edits do not need disclosure;
      YouTube's examples of what does not need disclosure include caption
      creation, production assistance such as outlines, scripts, thumbnails
      and titles, and cloning one's own voice for voice-overs or dubs.
    source_url: https://support.google.com/youtube/answer/14328491
    accessed: "2026-10-06"
    status: verified

  # -------------------------------------------------------------- Instagram
  - platform: instagram
    topic: reels_specs
    statement: >-
      A reel can be uploaded with an aspect ratio between 1.91:1 and 9:16.
      Reels should have a minimum frame rate of 30 frames per second and a
      minimum resolution of 720 pixels. The recommended cover photo size is
      420 by 654 pixels (1:1.55).
    source_url: https://help.instagram.com/1038071743007909
    accessed: "2026-10-06"
    status: verified
  - platform: instagram
    topic: metric_views
    statement: >-
      Account insights define views as the number of times content was played
      or displayed. For a reel, views is the number of times the reel starts
      to play or replay. Viewers is the number of unique accounts that have
      seen the reel on screen at least once, whether or not it was played,
      and is labeled by Instagram as estimated and in development. Watch time
      is the total time the reel was played, including replays. Average watch
      time is watch time divided by the number of initial views.
    source_url: https://help.instagram.com/202865988324236
    accessed: "2026-10-06"
    status: verified
  - platform: instagram
    topic: reels_insights_availability
    statement: >-
      Reel insights require a public account, are available for reels posted
      on or after May 14, 2021, and can be viewed for up to two years after
      the reel's original publish date.
    source_url: https://help.instagram.com/202865988324236
    accessed: "2026-10-06"
    status: verified
  - platform: instagram
    topic: branded_content_disclosure
    statement: >-
      Meta defines branded content as organic content for which the creator
      has been compensated by a brand or business partner, which may include
      gifted products and services. Creators must tag the business partner,
      which shows a "Paid partnership with" label. Content with an affiliate
      link should carry the paid partnership label and does not need a
      business partner tagged. On Instagram the label can be applied in Feed,
      Stories, Broadcast Channels, Live, Reels, and Instagram videos.
    source_url: https://www.facebook.com/business/help/788160621327601
    accessed: "2026-10-06"
    status: verified
  - platform: instagram
    topic: ai_content_label
    statement: >-
      Instagram publishes a "Label AI content on Instagram" help article. Its
      device-specific instructions and the exact conditions that require a
      label were not readable when this file was compiled.
    source_url: https://help.instagram.com/761121959519495
    accessed: "2026-10-06"
    status: not_verified
  - platform: instagram
    topic: caption_and_hashtag_limits
    statement: No official page stating caption or hashtag limits was read.
    source_url: https://help.instagram.com
    accessed: "2026-10-06"
    status: not_verified
  - platform: instagram
    topic: safe_zones
    statement: No official page stating numeric safe-zone margins was read.
    source_url: https://help.instagram.com
    accessed: "2026-10-06"
    status: not_verified

