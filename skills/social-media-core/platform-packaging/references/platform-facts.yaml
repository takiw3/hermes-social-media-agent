  # -------------------------------------------------- Endorsement guidance
  - platform: us_ftc
    topic: when_to_disclose
    statement: >-
      FTC guidance says to disclose any financial, employment, personal, or
      family relationship with a brand, and anything of value received to
      mention a product, including free or discounted products. The
      obligation applies even if followers may already know about the
      relationship and even if the opinion is unbiased. Tags, likes, and
      pins that show a brand preference can count as endorsements.
    source_url: https://www.ftc.gov/business-guidance/resources/disclosures-101-social-media-influencers
    accessed: "2026-10-06"
    status: verified
    note: >-
      The page refused the headless browser (HTTP 403) and was read through a
      fetch-and-summarize tool. Wording here follows that summary.
  - platform: us_ftc
    topic: how_to_disclose
    statement: >-
      FTC guidance says to place the disclosure where it is hard to miss,
      with the endorsement message itself. Do not rely on a profile page, the
      end of a post or video, or text behind a "more" link, and do not mix
      the disclosure into a group of hashtags. For video, the disclosure
      belongs in the video and not only in the description, ideally in both
      audio and visual form. For a live stream, repeat it periodically. Use
      simple, clear language such as "ad", "advertisement", or "sponsored",
      or a plain statement such as thanking a brand for a free product.
      Vague terms such as "sp", "spon", "collab", or a standalone "thanks"
      or "ambassador" are not enough. A platform's disclosure tool should be
      used in addition to, not instead of, the creator's own disclosure.
    source_url: https://www.ftc.gov/business-guidance/resources/disclosures-101-social-media-influencers
    accessed: "2026-10-06"
    status: verified
    note: Read through a fetch-and-summarize tool; see the entry above.
  - platform: us_ftc
    topic: owners_employees_affiliates_and_claims
    statement: >-
      FTC staff guidance says an employment or ownership relationship should
      be disclosed in the post itself, since listing an employer in a profile
      is not sufficient. Affiliate commissions should be disclosed clearly
      and close to the link. Testimonials must reflect real experience, and
      results presented as typical need substantiation from the advertiser.
      Buying fake likes, followers, or reviews is described as clearly
      deceptive. Responsibility for a clear and conspicuous disclosure rests
      with the influencer and the brand, not the platform.
    source_url: https://www.ftc.gov/business-guidance/resources/ftcs-endorsement-guides-what-people-are-asking
    accessed: "2026-10-06"
    status: verified
    note: Read through a fetch-and-summarize tool; see the entry above.
