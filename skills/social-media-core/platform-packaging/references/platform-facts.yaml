  # ----------------------------------------------------------------- TikTok
  - platform: tiktok
    topic: video_length
    statement: >-
      Videos recorded in TikTok can be up to 10 minutes long. Videos uploaded
      to TikTok can be up to 60 minutes long.
    source_url: https://support.tiktok.com/en/using-tiktok/creating-videos/camera-tools
    accessed: "2026-10-06"
    status: verified
  - platform: tiktok
    topic: content_disclosure_setting
    statement: >-
      Content that promotes a brand, product, or service must have the
      content disclosure setting turned on. This includes promoting yourself
      or your own business. A post promoting the creator's own brand or
      business is labeled "Promotional content". A post made on behalf of
      another business is labeled "Paid partnership". Posts without the
      proper disclosure may be removed or restricted.
    source_url: https://www.tiktok.com/support/faq_detail?id=7636670088170904085
    accessed: "2026-10-06"
    status: verified
    note: >-
      The former URL support.tiktok.com/en/business-and-creator/creator-and-business-accounts/promoting-a-brand-product-or-service
      redirected to this address on the access date.
  - platform: tiktok
    topic: branded_content_policy
    statement: >-
      TikTok's Branded Content Policy (published August 4, 2026, effective
      August 31, 2026) defines branded content as content that promotes or
      reviews a third-party brand or its products or services in exchange for
      payment or any other incentive, including gifted products, paid posts,
      commission through an affiliate link or promotional code, and a current
      or past commercial relationship such as acting as a brand ambassador.
      When posting it, the creator must enable the commercial content
      disclosure toggle, must make the promoted product or service clear
      without requiring viewers to visit the profile or a link, and must not
      make false, deceptive, or misleading claims. The policy lists
      prohibited and restricted industries.
    source_url: https://www.tiktok.com/legal/page/global/bc-policy/en
    accessed: "2026-10-06"
    status: verified
  - platform: tiktok
    topic: ai_content_label
    statement: >-
      TikTok requires creators to label AI-generated content that contains
      realistic images, audio, or video, and encourages labeling of content
      completely generated or significantly edited by AI. The creator label
      reads "creator labeled as AI-generated". TikTok may automatically apply
      an "AI-generated" label, including when uploaded content carries C2PA
      Content Credentials, and an automatic label cannot be removed by the
      creator. Not allowed even if labeled: AI content showing fake
      authoritative sources or crisis events, public figures falsely shown
      in certain contexts such as making an endorsement, the likeness of
      people under 18, or the likeness of adult private figures without
      their permission.
    source_url: https://www.tiktok.com/support/faq_detail?id=7636670084747893268
    accessed: "2026-10-06"
    status: verified
    note: >-
      The former URL support.tiktok.com/en/using-tiktok/creating-videos/ai-generated-content
      redirected to this address on the access date.
