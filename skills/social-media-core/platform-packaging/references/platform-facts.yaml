  # --------------------------------------------------------------- LinkedIn
  - platform: linkedin
    topic: video_file_requirements
    statement: >-
      Video file requirements: maximum file size 5 GB, minimum 75 KB; maximum
      duration 15 minutes; minimum duration 3 seconds from desktop and 2
      seconds from the mobile app; resolution range 256x144 to 4096x2304;
      aspect ratio 1:2.4 to 2.4:1; frame rate 10 to 60 frames per second; bit
      rate 192 Kbps to 30 Mbps. Supported file types include MP4, MOV, AVI,
      WEBM, and MKV. LinkedIn says to keep the edges of the video free of key
      elements, text, and logos, and gives no numeric margin.
    source_url: https://www.linkedin.com/help/linkedin/answer/a548372
    accessed: "2026-10-06"
    status: verified
    note: 'The page showed "Last updated: 2 years ago" on the access date.'
