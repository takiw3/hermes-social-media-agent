# Compatibility baseline, kept as a regression fixture.
#
# `baseline` is what the build brief recorded as of 2026-10-06. `observed` is
# what was found when the pinned releases were inspected the same day.
# scripts/check_upstream_contract.py re-checks every observation marked
# `checkable: true` against the vendored upstream copy, so a future update
# that changes one of them fails loudly instead of silently.
baseline:
  hermes: {version: "0.21.5", tag: "v2026.9.24", published: "2026-09-24"}
  hyperframes: {version: "0.8.137", published: "2026-10-06", npm: "hyperframes@0.8.137"}
tested:
  hermes:
    version: "0.21.5"
    tag: "v2026.9.24"
    commit: "f97608f178d1ffeca59860195ab7da295f7c8e5f"
    published: "2026-09-24T10:09:38Z"
  hyperframes:
    version: "0.8.138"
    tag: "v0.8.138"
    commit: "0ca28db4f8671a2e2262594e03c566222d695920"
    published: "2026-10-06T18:19:06Z"
    note: >-
      v0.8.138 was published on the build day, after the baseline was written.
      The baseline tag v0.8.137 (commit d09e003b17610177b71e340ec0bac95c9dde3e64)
      was also inspected. The pin is the newer release.
  environment:
    os: "macOS 26.6.2 (25G83), arm64"
    node: "v22.23.1"
    ffmpeg: "8.1"
    python: "3.10.9 (tests), 3.11.15 (Hermes)"
observations:
  - id: 1
    claim: Upstream SKILL.md frontmatter contains only name and description.
    held_at_pin: true
    checkable: true
  - id: 2
    claim: Upstream skills link to each other with relative ../ paths that need sibling folders.
    held_at_pin: true
    checkable: true
  - id: 3
    claim: Upstream skills refer to each other as slash commands.
    held_at_pin: true
    checkable: true
  - id: 4
    claim: The router tells the agent to run a skills update before entering a workflow, and workflows carry a freshness step.
    held_at_pin: true
    checkable: true
  - id: 5
    claim: The CLI installs skills into ~/.claude/skills and ~/.agents/skills and does not know a Hermes profile home.
    held_at_pin: true
    checkable: false
    evidence: packages/cli/src/commands/skills.ts at the tag
  - id: 6
    claim: HYPERFRAMES_SKIP_SKILLS=1 is the opt-out; --skip-skills is temporarily ignored; HYPERFRAMES_NO_TELEMETRY and HYPERFRAMES_NO_UPDATE_CHECK exist.
    held_at_pin: true
    checkable: true
    extra: The tagged CLI also reads HYPERFRAMES_NO_AUTO_INSTALL (utils/autoUpdate.ts) and DO_NOT_TRACK. The launcher sets both.
  - id: 7
    claim: references/plugin-installation.md defines a plugin mode keyed on a plugin.json two levels above the loaded SKILL.md.
    held_at_pin: true
    checkable: true
  - id: 8
    claim: usage --json detects only claude-code, codex, and grok, and returns status unknown under Hermes.
    held_at_pin: true
    checkable: false
    evidence: 'Observed output under the launcher: {"status":"unknown","reason":"unsupported_harness"}'
  - id: 9
    claim: Every documented command is a bare npx hyperframes.
    held_at_pin: true
    checkable: true
    extra: 420 occurrences in the 15 vendored skills, plus 3 of npx hyperframes@latest.
  - id: 10
    claim: Rendering needs Node.js 22 or newer, FFmpeg, and a headless Chrome downloaded on first use.
    held_at_pin: true
    checkable: false
    evidence: npm engines field is node >=22; CLI pins chrome-headless-shell 152.0.7977.30
  - id: 11
    claim: media-use can use HEYGEN_API_KEY, GEMINI_API_KEY, ELEVENLABS_API_KEY, HYPERFRAMES_API_KEY; the CLI exposes publish, cloud, lambda, cloudrun.
    held_at_pin: true
    checkable: true
  - id: 12
    claim: Local transcription uses a Parakeet model that models install parakeet downloads; CC-BY-4.0.
    held_at_pin: true
    checkable: true
  - id: 13
    claim: The skills contain binary assets and CREDITS.md lists GSAP under the GSAP Standard License.
    held_at_pin: true
    checkable: true
    extra: >-
      In the 15 vendored skills: 19 MP3, 56 WOFF2, 2 SVG, no PNG. The 66 PNG
      files in the baseline are in skills that are not vendored. One vendored
      skill also carried a GSAP file and a font with conflicting license
      metadata; both are withheld.
  - id: 14
    claim: The skills tree contains no symlinks, has nested .gitignore files, and one loose test file.
    held_at_pin: true
    checkable: false
    evidence: checked at import time; the import refuses a symlink
  - id: 15
    claim: The Hermes optional skill installs hyperframes@>=0.4.2 globally with no upper pin.
    held_at_pin: true
    checkable: false
    evidence: optional-skills/creative/hyperframes/scripts/setup.sh; Hermes' own install scan reports unpinned_npm_install and sudo_usage
  - id: 16
    claim: The Hermes optional skill and the upstream router are both named hyperframes.
    held_at_pin: true
    checkable: false
    evidence: tests/test_install.py reproduces the collision on Hermes 0.21.5
